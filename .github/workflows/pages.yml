# Publie le dossier public/ sur GitHub Pages à chaque push sur main.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Chaque mise en ligne a sa propre version : les navigateurs rechargent le code et les données
      # au lieu de garder l'ancienne version en cache.
      - name: Versionner les fichiers
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#(from '\./[a-z0-9-]+\.js)'#\1?v=$V'#g" public/js/*.js
          sed -i -E "s#(src|href)=\"(js/app\.js|css/styles\.css)\"#\1=\"\2?v=$V\"#g; s#<meta name=\"build\" content=\"\"#<meta name=\"build\" content=\"$V\"#" public/index.html
          grep -c "?v=$V" public/index.html public/js/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
